<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 「言」の字を図形で組んだマーク。上の線は字幕の行、下の四角は口（話し声）を表す。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d94f41" />
      <stop offset="1" stop-color="#a3261d" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <g fill="#fff">
    <rect x="51" y="19" width="26" height="10" rx="5" />
    <rect x="24" y="37" width="80" height="10" rx="5" />
    <rect x="36" y="55" width="56" height="10" rx="5" />
  </g>
  <rect x="41" y="78" width="46" height="27" rx="7" fill="none" stroke="#fff" stroke-width="10" />
</svg>
