<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kotodama</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf8;
        --fg: #1c1b1a;
        --muted: #77726b;
        --line: #e6e2dc;
        --hover: #f1eee9;
        --accent: #b8322a;
        --latest: #fff4e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19181a;
          --fg: #ecebe9;
          --muted: #96918a;
          --line: #2e2c2f;
          --hover: #232125;
          --accent: #f07a6e;
          --latest: #2b2420;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { margin: 0; font-size: 14px; letter-spacing: 0.04em; }
      #status { display: flex; gap: 6px; align-items: center; min-width: 0; color: var(--muted); font-size: 12px; }
      #status::before { flex: none; width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; content: ""; }
      #status[data-state="listening"]::before { background: #3ecf6e; }
      #status[data-state="connecting"]::before { background: #f0b429; }
      #status[data-state="error"] { color: var(--accent); }
      #status[data-state="error"]::before { background: var(--accent); }
      #status span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      header button {
        margin-left: auto;
        padding: 3px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      header button + button { margin-left: 0; }
      header button:hover { background: var(--hover); color: var(--fg); }
      #list { flex: 1; overflow-y: auto; margin: 0; padding: 6px 0 12px; list-style: none; }
      #list li.entry {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        padding: 7px 14px 7px 10px;
      }
      #list li.entry:hover { background: var(--hover); }
      #list li.entry.latest { background: var(--latest); }
      #list li.title {
        margin-top: 8px;
        padding: 8px 14px 4px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }
      #list li.title:first-child { margin-top: 0; border-top: 0; }
      .time {
        align-self: start;
        margin-top: 2px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
        font-variant-numeric: tabular-nums;
        text-align: right;
        cursor: pointer;
      }
      .time:hover { text-decoration: underline; }
      .time:disabled { color: var(--muted); cursor: default; text-decoration: none; }
      .ja { margin: 0; }
      .en { margin: 1px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      #empty { padding: 28px 18px; color: var(--muted); font-size: 13px; text-align: center; }
      #video {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      #video[hidden] { display: none; }
      #video-title {
        flex: 1;
        overflow: hidden;
        color: var(--fg);
        font-weight: 600;
        white-space: nowrap;
        text-decoration: none;
        text-overflow: ellipsis;
      }
      #video-title:hover { text-decoration: underline; }
      #video button {
        flex: none;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #video button:hover { background: var(--hover); color: var(--fg); }
      #video button[hidden] { display: none; }
      #list li.entry.playing { background: var(--latest); box-shadow: inset 3px 0 0 var(--accent); }
      #list li.video {
        display: block;
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      #list li.video:hover { background: var(--hover); }
      #list li.video strong { display: block; font-size: 14px; font-weight: 600; }
      #list li.video span { color: var(--muted); font-size: 12px; }
      #history[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
      #summary {
        flex: none;
        max-height: 55%;
        overflow-y: auto;
        padding: 10px 14px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--hover);
      }
      #summary[hidden] { display: none; }
      #summary-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
      #summary-head h2 { margin: 0; font-size: 13px; }
      #summary-meta { margin-right: auto; color: var(--muted); font-size: 11px; }
      #summary-head button {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #summary-head button:hover { background: var(--bg); color: var(--fg); }
      #summary-message { margin: 0; color: var(--muted); font-size: 13px; }
      #summary-message.error { color: var(--accent); }
      #summary-message:empty, #summary-overview:empty { display: none; }
      #summary-overview { margin: 0 0 8px; font-size: 14px; }
      #summary-points { margin: 0; padding: 0; list-style: none; }
      #summary-points li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 3px 0; font-size: 14px; }
      #summarize:disabled { opacity: 0.5; cursor: default; }
      #now {
        min-height: 4.4em;
        padding: 8px 14px 10px;
        border-top: 1px solid var(--line);
      }
      #now-label { margin: 0 0 2px; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
      #draft { margin: 0; color: var(--fg); opacity: 0.78; }
      #draft:empty::before { color: var(--muted); font-size: 12px; content: "話し始めると、途中の訳がここに出ます"; }
      #live { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-style: italic; line-height: 1.5; }
      #live[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Kotodama</h1>
      <div id="status" role="status"><span>停止中</span></div>
      <button id="summarize" type="button">まとめ</button>
      <button id="history" type="button">履歴</button>
      <button id="copy" type="button">コピー</button>
    </header>
    <div id="video">
      <a id="video-title" target="_blank" rel="noreferrer"></a>
      <button id="back" type="button" hidden>再生中の動画へ戻る</button>
      <button id="delete" type="button">削除</button>
    </div>
    <section id="summary" hidden>
      <div id="summary-head">
        <h2>ここまでのまとめ</h2>
        <span id="summary-meta"></span>
        <button id="summary-redo" type="button">作り直す</button>
        <button id="summary-copy" type="button">コピー</button>
        <button id="summary-close" type="button" aria-label="まとめを閉じる">閉じる</button>
      </div>
      <p id="summary-message"></p>
      <p id="summary-overview"></p>
      <ul id="summary-points"></ul>
    </section>
    <ol id="list" aria-live="polite"></ol>
    <div id="now">
      <p id="now-label">聞き取り中（仮の訳）</p>
      <p id="draft" aria-live="off"></p>
      <p id="live"></p>
    </div>
    <script src="timeline.js"></script>
  </body>
</html>
